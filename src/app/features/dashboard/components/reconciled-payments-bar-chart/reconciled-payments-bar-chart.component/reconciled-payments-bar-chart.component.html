<div class="chart-card">

    <div class="chart-header">

        <h3>
            Reconciled payments
        </h3>

        <p>
            Last 6 months
        </p>

    </div>

    <apx-chart
        #chart
        [series]="chartSeries"
        [chart]="chartDetails"
        [xaxis]="chartXAxis"
        [plotOptions]="chartPlotOptions"
        [dataLabels]="chartDataLabels"
        [colors]="chartColors">
    </apx-chart>

</div>
