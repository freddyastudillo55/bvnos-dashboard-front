<div class="login-container">

    <div class="login-card">

        <h1>Login to Dashboard BVNOs</h1>

        <h3>Please enter your email and password to continue</h3>

        <form (ngSubmit)="login()">

            <div class="form-group">
                <label>Email address</label>

                <input type="email" [(ngModel)]="email" name="email" placeholder="alex.astudillo@compax.com">
            </div>

            <div class="form-group">
                <label>Password</label>

                <input type="password" [(ngModel)]="password" name="password" placeholder="********">
            </div>

            <div *ngIf="errorMessage" class="error-message">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span>{{ errorMessage }}</span>
            </div>

            <div class="remember-container">

                <input type="checkbox" id="rememberPassword" name="rememberPassword" [(ngModel)]="rememberPassword">

                <label for="rememberPassword">
                    Remember Password
                </label>

            </div>

            <button type="submit" [disabled]="loading">
                <i *ngIf="loading" class="fa-solid fa-spinner fa-spin"></i>
                {{ loading ? 'Signing in...' : 'Sign In' }}
            </button>

            <h3 class="contact-message">
                Contact the administrator if you do not have an account
            </h3>

        </form>

    </div>

</div>
